services:
  postgres:
    image: postgres:18.4
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: smoke
    healthcheck:
      test: [CMD, pg_isready, -h, 127.0.0.1, -U, postgres, -d, smoke]
      interval: 1s
      timeout: 5s
      retries: 60
  migrator:
    image: ${MIGRATOR_IMAGE:?Set the immutable migrator image ID}
    profiles: [migration]
    environment:
      MIGRATOR_EXECUTE: "true"
networks:
  default:
    internal: true
