name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-slim
    env:
      ARTIFACT_ELIGIBLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (github.event.pull_request.user.login == 'renovate[bot]' || (github.event.pull_request.user.login == 'air-hand-release-app[bot]' && startsWith(github.event.pull_request.head.ref, 'renovate-jobdeck/'))) }}
      NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ case(env.ARTIFACT_ELIGIBLE == 'true', github.event.pull_request.head.sha, github.sha) }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@942a96db0ec375d908dd8a8fd97cefc6eaf9f734 # v1.7.2
      - name: Restore Nuget cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: build
        run: make build
      - name: verify published browser boundary
        run: |
          dotnet publish src/bff/ui.csproj --no-restore --configuration Release --output "$RUNNER_TEMP/ui-publish"
          bash scripts/check-browser-assets.sh "$RUNNER_TEMP/ui-publish"
      - name: test NuGet source resolution (.NET only)
        run: dotnet run --project tools/NuGetDocuments.Tests
      - name: generate NuGet licenses
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make licenses
      - name: preserve generated NuGet documents
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-original-documents
          path: third_party/licenses/nuget
          if-no-files-found: error
          retention-days: 7
      - name: update generated licenses
        uses: air-hand-org/jobdeck-actions/actions/auto-commit@942a96db0ec375d908dd8a8fd97cefc6eaf9f734 # v1.7.2
        with:
          eligible: ${{ env.ARTIFACT_ELIGIBLE }}
          paths: |
            third_party/licenses/nuget
          expected-head: ${{ github.event.pull_request.head.sha }}
          head-branch: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.repository.name }}
          app-client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
