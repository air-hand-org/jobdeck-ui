name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-slim
    env:
      # Temporary opt-in for this same-repository draft trial only.
      ARTIFACT_ELIGIBLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'ci/nuget-license-trial' }}
      NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ case(env.ARTIFACT_ELIGIBLE == 'true', github.event.pull_request.head.sha, github.sha) }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@v1.4.1
      - name: Restore Nuget cache
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: build
        run: make build
      - name: collect current NuGet license output
        id: collection
        shell: bash
        run: |
          set +e
          make nuget-license-trial
          status=$?
          set -e
          echo "exit-status=$status" >> "$GITHUB_OUTPUT"
          # Draft review retains generated errors; the final gate still fails.
          if [[ "$status" != 0 && ( "$ARTIFACT_ELIGIBLE" != true || "$status" != 2 ) ]]; then
            exit "$status"
          fi
      - name: update trial license output
        uses: air-hand-org/jobdeck-actions/actions/auto-commit@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
        with:
          eligible: ${{ env.ARTIFACT_ELIGIBLE }}
          paths: |
            third_party/nuget-license-trial
          expected-head: ${{ github.event.pull_request.head.sha }}
          head-branch: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.repository.name }}
          app-client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
      - name: require resolved original licenses
        if: ${{ !cancelled() && steps.collection.outputs.exit-status != '' }}
        env:
          COLLECTION_STATUS: ${{ steps.collection.outputs.exit-status }}
        run: exit "$COLLECTION_STATUS"
