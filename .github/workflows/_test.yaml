name: Test

on:
  workflow_call:

permissions: {}

# Keep only the newest test run for a branch or pull request.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      packages: read
    runs-on: ubuntu-slim
    env:
      ARTIFACT_ELIGIBLE: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'renovate[bot]' && github.event.pull_request.head.repo.full_name == github.repository }}
      NuGetPackageSourceCredentials_github: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ case(env.ARTIFACT_ELIGIBLE == 'true', github.event.pull_request.head.sha, github.sha) }}
      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@287f4026cd3c9245ccb7755f427ce5c8ebe75482 # v1.4.1
      - name: Restore Nuget cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: build
        run: make build
      - name: generate NuGet licenses
        run: make licenses
      - name: update generated licenses
        uses: air-hand-org/jobdeck-actions/actions/auto-commit@1d9ce1953c373273f28cac191bcf5ff0fc58100d # v1.7.0
        with:
          eligible: ${{ env.ARTIFACT_ELIGIBLE }}
          paths: |
            third_party/licenses/nuget
          expected-head: ${{ github.event.pull_request.head.sha }}
          head-branch: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.repository.name }}
          app-client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          app-private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
      - name: lint
        run: make lint
      - name: check clean
        run: make check-clean
      - name: test
        run: make test
