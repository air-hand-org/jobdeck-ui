name: Deploy

on:
  release:
    types:
      - published

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  images:
    if: ${{ github.event.release.prerelease == false }}
    uses: $/.github/workflows/_build-images.yaml
    with:
      push: true
      image-tag: ${{ github.event.release.tag_name }}
      environment: production
    secrets: inherit
    permissions:
      contents: read
      packages: write
      id-token: write

  release-dispatch:
    if: ${{ github.event.release.prerelease == false }}
    needs: images
    uses: air-hand-org/jobdeck-actions/.github/workflows/reusable-release-dispatch.yaml@5d5ae954d815d44bd28dbebd4c920773aed02c8d # v1.7.4
    with:
      service-names: ui,ui-migrator
    secrets: inherit
