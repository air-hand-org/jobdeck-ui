on:
  workflow_call:

permissions: {}

jobs:
  infrastructure-changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    permissions:
      pull-requests: read
    outputs:
      bootstrap: ${{ steps.filter.outputs.bootstrap }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            bootstrap:
              - 'iac/bootstrap/**'
              - '.github/actions/setup-tools/**'
              - '.github/workflows/_ci.yaml'
              - '.github/workflows/_tofu.yaml'
              - 'aqua.yaml'
              - 'mise.toml'
              - 'Makefile'
              - 'mkfiles/tofu.mk'
            app:
              # The app root reads bootstrap state, so bootstrap changes also
              # need an app plan to verify the roots remain compatible.
              - 'iac/app/**'
              - 'iac/bootstrap/**'
              - 'iac/secrets/**'
              - 'environments/production.yaml'
              - '.github/actions/setup-tools/**'
              - '.github/workflows/_ci.yaml'
              - '.github/workflows/_tofu.yaml'
              - 'aqua.yaml'
              - 'mise.toml'
              - 'Makefile'
              - 'mkfiles/tofu.mk'

  # This nested reusable workflow owns test-only concurrency, so cancelling a
  # superseded test run never cancels this workflow's infrastructure plan.
  test:
    uses: ./.github/workflows/_test.yaml
    permissions:
      contents: read
      packages: read
    secrets: inherit

  container-build:
    # Keep the release-only push workflow honest: every production Dockerfile
    # must build on a pull request, without authenticating to GCP or pushing.
    uses: ./.github/workflows/_build-images.yaml
    permissions:
      contents: read
      packages: read
      # Workflow validation checks permissions requested by every nested job,
      # including the publish-only job which is skipped for CI builds.
      id-token: write
    with:
      push: false
    secrets: inherit

  infrastructure-plan:
    # Fork PRs run the test job, but never receive a GCP OIDC token. This
    # condition is defence in depth; the Workload Identity Provider must also
    # restrict tokens to the air-hand-org/jobdeck repository.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.infrastructure-changes.outputs.bootstrap == 'true'
    needs: infrastructure-changes
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: bootstrap
      command: plan
      environment: plan
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write

  application-infrastructure-plan:
    # The app root reads the bootstrap state, so planning it here also verifies
    # that the two OpenTofu roots remain compatible.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.infrastructure-changes.outputs.app == 'true'
    needs: infrastructure-changes
    uses: ./.github/workflows/_tofu.yaml
    with:
      root: app
      command: plan
      environment: plan
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: write
