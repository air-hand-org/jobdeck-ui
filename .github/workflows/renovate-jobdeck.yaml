name: Renovate Jobdeck NuGet

on:
  workflow_call:
    secrets:
      GH_APP_RELEASE_PRIVATE_KEY:
        required: true

permissions: {}

concurrency:
  group: renovate-jobdeck-main
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Check Jobdeck NuGet updates
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          configurationFile: .github/renovate-jobdeck.json
          token: ${{ steps.app-token.outputs.token }}
        env:
          # Registry credentials are deliberately separate from the Git/PR App token.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"nuget","matchHost":"https://nuget.pkg.github.com/air-hand-org/","username":"${{ github.actor }}","password":"${{ secrets.GITHUB_TOKEN }}"}]
