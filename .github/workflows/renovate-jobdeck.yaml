name: Renovate Jobdeck NuGet

on:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: renovate-jobdeck-main
  cancel-in-progress: false

jobs:
  renovate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create repository-scoped GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: write
      - name: Check Jobdeck NuGet updates
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          configurationFile: .github/renovate-jobdeck.json
          renovate-version: 44.193.1
          token: ${{ steps.app-token.outputs.token }}
        env:
          # Registry credentials are deliberately separate from the Git/PR App token.
          RENOVATE_HOST_RULES: >-
            [{"hostType":"nuget","matchHost":"https://nuget.pkg.github.com/air-hand-org/","username":"${{ github.actor }}","password":"${{ secrets.GITHUB_TOKEN }}"}]
