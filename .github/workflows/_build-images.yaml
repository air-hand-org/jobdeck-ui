name: Build images

on:
  workflow_call:
    inputs:
      push:
        description: Publish images to Artifact Registry and GHCR instead of only building them.
        required: false
        type: boolean
        default: false
      image-tag:
        description: Immutable image tag. Required when push is true.
        required: false
        type: string
        default: ""
      environment:
        description: GitHub environment containing GCP deployment variables.
        required: false
        type: string
        default: ""

concurrency:
  # CI build-only runs are disposable and share a group per ref. Publishing is
  # keyed by immutable release tag and must never be cancelled mid-push.
  group: build-images-${{ inputs.push && inputs.image-tag || github.ref }}
  cancel-in-progress: ${{ inputs.push == false }}

permissions: {}

jobs:
  build:
    # CI uses this path. It intentionally has neither a GitHub environment nor
    # OIDC permissions, so it cannot access GCP or push.
    if: ${{ inputs.push == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        target:
          - stage: "ui"
            ghcr: "jobdeck-ui"
          - stage: "migrator"
            ghcr: "jobdeck-ui-migrator"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: jobdeck-ui:test
          target: ${{ matrix.target.stage }}
          cache-from: type=gha,scope=${{ matrix.target.stage }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.stage }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            github_packages_token=${{ secrets.GITHUB_TOKEN }}

      - uses: air-hand-org/jobdeck-actions/actions/setup-tools@942a96db0ec375d908dd8a8fd97cefc6eaf9f734 # v1.7.2
        if: matrix.target.stage == 'migrator'
      - name: Smoke test production migrator image
        if: matrix.target.stage == 'migrator'
        timeout-minutes: 5
        run: dotnet run --file scripts/test-migration-image.cs -- jobdeck-ui:test

  publish:
    if: ${{ inputs.push == true }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        target:
          - stage: "ui"
            ghcr: "jobdeck-ui"
          - stage: "migrator"
            ghcr: "jobdeck-ui-migrator"
    env:
      ARTIFACT_REGISTRY_HOST: asia-northeast1-docker.pkg.dev
      IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - name: setup IMAGE envs
        run: |
          echo "AR_IMAGE=${AR_IMAGE}" >> "$GITHUB_ENV"
          echo "GHCR_IMAGE=${GHCR_IMAGE}" >> "$GITHUB_ENV"
        env:
          AR_IMAGE: ${{ env.ARTIFACT_REGISTRY_HOST }}/${{ vars.GCP_PROJECT_ID }}/jobdeck-ui/${{ matrix.target.stage }}:${{ env.IMAGE_TAG }}
          GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.target.ghcr }}:${{ env.IMAGE_TAG }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Validate image tag
        run: test -n "$IMAGE_TAG"
      - id: google-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # Artifact Registry accepts an OAuth access token as the Docker
          # password. This avoids configuring mutable Docker credential-helper
          # state with gcloud.
          token_format: access_token
      - name: Log in to Artifact Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.ARTIFACT_REGISTRY_HOST }}
          username: oauth2accesstoken
          password: ${{ steps.google-auth.outputs.access_token }}
      - name: Login to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check whether image already exists
        id: image
        uses: air-hand-org/jobdeck-actions/actions/image-exists@942a96db0ec375d908dd8a8fd97cefc6eaf9f734 # v1.7.2
        with:
          image: ${{ env.AR_IMAGE }}
      - name: Build and push image
        if: ${{ steps.image.outputs.exists != 'true' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.AR_IMAGE }}
          target: ${{ matrix.target.stage }}
          cache-from: type=gha,scope=${{ matrix.target.stage }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target.stage }}
          build-args: |
            GITHUB_ACTOR=${{ github.actor }}
          secrets: |
            github_packages_token=${{ secrets.GITHUB_TOKEN }}
      # Always check GHCR, including when a previous attempt already pushed to AR.
      - name: Copy image to GHCR if missing
        uses: air-hand-org/jobdeck-actions/actions/copy-image@942a96db0ec375d908dd8a8fd97cefc6eaf9f734 # v1.7.2
        with:
          src: ${{ env.AR_IMAGE }}
          dest: ${{ env.GHCR_IMAGE }}
